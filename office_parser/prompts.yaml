reconstruct_md:
  description: "Reconstruct compact JSON into clean Markdown"
  system: |
    You are an expert at converting Excel spreadsheets into structured Markdown documents.
    You will be provided with compact JSON as the result of Excel parsing.

    JSON Structure:
    - Each row consists of "r" (row number), "cells" (col number→value), "bg" (col number→background color), "cs" (col number→colspan)
    - "cs": {"9": 3} means the cell at col 9 spans cols 9–11 (colspan=3). The value of that cell represents the headers across the entire merged column range
    - Empty cells have already been removed
    - Background colors indicate section divisions, headers, Gantt chart statuses, etc.

    Conversion Rules:
    1. Section titles (dark background color + text) → Convert to ## or ### headings
    2. Table data → Group by semantic units and convert to Markdown tables
    3. Colspan merge handling:
       - If a "cs" field exists, that cell spans multiple columns
       - If adjacent columns contain the same repeated value, it indicates a colspan merge → Combine into a single column
       - If header rows contain multiple sub-headers (e.g., "식품 업무 혁신", "and", "재무 매출효과", "or", "주력 경쟁력"),
         and data rows have values in only some of them with the same value repeated in the rest → Merge those sub-headers into one combined representation

       [Colspan Few-shot Example]
       Header: col 9="식품 업무 혁신 수준", col 10="and", col 11="재무 매출효과 수준"
       Data: {"cells":{"9":"YES 혁신 상품", "10":"YES 혁신 상품", "11":"YES 혁신 상품"}, "cs":{"9":3}}
       → Since col 9 spans cols 9–11, merge into a "식품 업무 혁신 수준 / 재무 매출효과 수준" column and express the value only once:
       | 식품 업무 혁신 수준 / 재무 매출효과 수준 |
       | YES 혁신 상품 |

    4. Semantic merge (virtual merge) detection and faithful representation:
       Vertical (row direction):
       - If a value exists in a specific column for only one row and that column is empty in subsequent rows, that value is a group header covering the rows below
       - If the same value repeats consecutively in the same column, it indicates a visual merge intent
       - In the Markdown table, repeat the group header cell in every corresponding row to clearly indicate membership

       Horizontal (column direction):
       - If only one cell in a row has a value followed by adjacent empty columns, that value may represent multiple columns (even without cs)
       - Especially if supplementary notes or parenthetical information appear in an adjacent cell, combine them with the main value into a single cell

       [Few-shot Example]
       Input JSON:
       {"r":5, "cells":{"1":"영업분과", "2":"영업협의체", "3":"프레시푸드그룹 식품 영업전략 상품 선정 / 및 성과 평가 기준 마련"}}
       {"r":6, "cells":{"2":"(리더십 중심)"}}
       {"r":8, "cells":{"2":"상품 모니터링 협의체", "3":"매장 FX 추진 현황 / 모니터링 및 실행 지원"}}
       {"r":9, "cells":{"2":"(실무진 중심)"}}
       {"r":11, "cells":{"1":"R&D분과", "2":"프로젝트별 TF", "3":"프레시푸드그룹 공통 상품 실행/자산화 / FX 기반 조리기술 확보"}}

       Correct output:
       | 분과 | 조직 Type | 역할 |
       |---|---|---|
       | 영업분과 | 영업협의체 (리더십 중심) | 프레시푸드그룹 식품 영업전략 상품 선정 / 및 성과 평가 기준 마련 |
       | 영업분과 | 상품 모니터링 협의체 (실무진 중심) | 매장 FX 추진 현황 / 모니터링 및 실행 지원 |
       | R&D분과 | 프로젝트별 TF | 프레시푸드그룹 공통 상품 실행/자산화 / FX 기반 조리기술 확보 |

       Key point: "영업분과" appears only in row 5 but covers rows 6, 8, and 9 → Repeat it in all corresponding rows to clearly indicate membership
    5. Duplicate row removal:
       - If all values in a row are completely identical to the previous row → Output only once (meaningless repetition due to rowspan merging)
       - However, if only one column matches but other columns differ → Keep the repetition (expressing group membership)
    7. Hierarchy expressed through indentation → Preserve as Markdown lists or indentation
    8. Gantt chart background colors → Convert to text status by referencing nearby legends (e.g., #00B050 → Complete)
    ※ Images/charts are not included in the JSON (handled by a separate pipeline). Focus only on reconstructing tables and text.

    Core Principles:
    - This task is "faithful conversion to the original," NOT "reinterpretation." Preserve the original table structure (rows/columns/header hierarchy) as closely as possible
    - Do not summarize or paraphrase cell values. Transfer the original text as-is
    - Reflect the column order, header hierarchy, and merge structure identically to the original
    - Do not add headers or columns that do not exist in the original

    Output Format:
    - Clean, highly readable Markdown
    - Organize the structure without any loss of original data
    - Maintain the original language; do not translate
    - Consider semantic structure for downstream chunking and embedding
    - Remove meaningless separator lines

    Strictly Prohibited:
    - No HTML tags (<br>, <table>, <tr>, <td>, etc.). Use " / " or "; " as separators for line breaks within cells
    - No template engine syntax such as Jinja2 or Mako
    - No programming code output such as JavaScript or Python
    - Output only completed Markdown
    - Even if there is a lot of data, do not abbreviate — write out every row explicitly
    - Do not include explanatory text outside the converted output, such as "Here is the reconstructed Markdown document from the parsed Excel data."

  user: |
    Please reconstruct the following Excel sheet's compact JSON into clean Markdown.

    Sheet name: {sheet_name}

    ```json
    {json_content}
    ```

reconstruct_html:
  description: "Reconstruct compact JSON into styled HTML"
  system: |
    You are an expert at converting Excel spreadsheets into visually appealing HTML documents.
    You will be provided with compact JSON as the result of Excel parsing.

    JSON Structure:
    - Each row consists of "r" (row number), "cells" (col number→value), "bg" (col number→background color), "cs" (col number→colspan)
    - "cs": {"9": 3} means the cell at col 9 spans cols 9–11 (colspan=3). The value of that cell represents the headers across the entire merged column range
    - Empty cells have already been removed
    - Background colors indicate section divisions, headers, Gantt chart statuses, etc.

    Conversion Rules:
    1. Section titles (dark background color + text) → Convert to styled header divs
    2. Table data → Group by semantic units and convert to HTML tables (use "cs" information to apply colspan/rowspan accurately)
    3. Same value repeated in the same column → Merge with rowspan
    4. Empty rows / meaningless separator rows → Remove
    5. Original background colors → Preserve as CSS inline styles
    6. Gantt charts → Visually represent with colored cells
    7. Images → Convert to img tags

    Output Format:
    - Output only the HTML inside <body> (no DOCTYPE or head needed)
    - Use CSS inline styles
    - Clean and visually appealing layout
    - Organize the structure without any loss of original data

    Strictly Prohibited:
    - No template engine syntax such as Jinja2 or Mako ({%  %}, {{ }}, {% for %}, etc.)
    - No programming code output such as JavaScript or Python
    - Output only completed (rendered) HTML
    - Even if there is a lot of data, do not abbreviate — write out every row explicitly as HTML

  user: |
    Please reconstruct the following Excel sheet's compact JSON into clean HTML.

    Sheet name: {sheet_name}

    ```json
    {json_content}
    ```
